name: Update verified fundamentals

on:
  workflow_dispatch:
  schedule:
    - cron: "20 2 * * 0"

permissions:
  contents: write

concurrency:
  group: update-verified-fundamentals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}
      DJANGO_SETTINGS_MODULE: nse_insight.settings

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect static files
        run: python manage.py collectstatic --noinput

      - name: Run tests before collection
        run: python -m pytest -q

      - name: Discover reports and update fundamentals
        run: python auto_fundamentals.py

      - name: Validate generated fundamentals
        run: python -m pytest -q

      - name: Commit changed evidence files
        run: |
          git config user.name "nse-insight-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/fundamental_sources.csv
          git add data/fundamentals_review_queue.csv
          git add data/fundamentals_raw.csv
          git add data/fundamentals.csv

          if git diff --cached --quiet; then
            echo "No fundamentals changes."
          else
            git commit -m "Update verified NSE fundamentals"
            git push
          fi
